<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bibliotheque - Usagers</title>
</head>
<body>

<nav>
    <div>
        <div>
            <a href=".">Retour à l'accueil</a>
        </div>
    </div>
</nav>


<div>
    <h2>Liste des Usagers</h2>
    <div>
        <table>
            <thead>
            <tr>
                <th>Nom</th>
                <th>Prenom</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${usagers.empty}">
                <td colspan="3">Aucun usager en base de données</td>
            </tr>
            <tr th:each="usager: ${usagers}">
                <td><span th:text="${usager.getNom().toUpperCase()}"> Nom </span></td>
                <td><span th:text="${usager.getPrenom()}"> Prenom </span></td>
                <td><a th:href="'/voirUnUsager/'+${usager.getNom()}">Voir</a></td>
            </tr>
            </tbody>
        </table>
        <button onclick="window.location.href = '/formUsager';">Ajouter un Usager</button>
    </div>
</div>
</body>
</html>
