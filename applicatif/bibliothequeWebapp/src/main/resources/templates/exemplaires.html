<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exemplaires</title>
</head>
<body>
<a href="/">Retour à l'accueil</a>
<h2>Liste des exemplaires</h2>
<table border="1">
    <tr><th>Num</th><th>Titre</th><th>Etat</th><th>Voir</th></tr>
    <tr th:each="ex : ${exemplaires}">
        <td th:text="${ex.getNumExemplaire()}"></td>
        <td th:text="${ex.titreOeuvre}"></td>
        <td th:text="${ex.etat}"></td>
        <td><a th:href="@{/voirUnExemplaire/{num}(num=${ex.numExemplaire})}">Voir</a></td>
        <td>
            <!-- Formulaire pour supprimer l'exemplaire -->
            <form th:action="@{/deleteExemplaire}" method="post">
                <input type="hidden" name="numExemplaire" th:value="${ex.numExemplaire}" />
                <button type="submit" onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet exemplaire ?');">
                    Supprimer
                </button>
            </form>
        </td>
    </tr>
</table>
<button onclick="window.location.href = '/formExemplaire';">Ajouter un exemplaire</button>
<br/>
</body>
</html>
